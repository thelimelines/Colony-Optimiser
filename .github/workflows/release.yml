name: Verify and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COLONY_SURVIVAL_GAMEDATA: ${{ github.workspace }}\work\ColonySurvival\gamedata
    steps:
      - name: Check out Colony Optimizer
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = [string]$props.Project.PropertyGroup.Version

          if ($tagVersion -ne $projectVersion) {
            throw "Release tag $tagVersion does not match Directory.Build.props version $projectVersion."
          }
      - name: Verify release changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $heading = "## [$tagVersion]"

          if (-not (Select-String -LiteralPath CHANGELOG.md -SimpleMatch $heading -Quiet)) {
            throw "Release tag $env:GITHUB_REF_NAME has no curated CHANGELOG.md entry headed '$heading'."
          }
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $tagCommit origin/main

          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF_NAME does not point to a commit on main."
          }
      - name: Check out validated Colony Survival data
        uses: actions/checkout@v7
        with:
          repository: pipliz/ColonySurvival
          ref: 7a5121763f93d768599e5d04b5c74f6645670f50
          path: work/ColonySurvival
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore ColonyOptimizer.slnx --runtime win-x64 --locked-mode
          dotnet restore installer\ColonyOptimizer.Installer\ColonyOptimizer.Installer.wixproj --locked-mode
          dotnet restore installer\ColonyOptimizer.Setup\ColonyOptimizer.Setup.wixproj --locked-mode
      - name: Run tests
        run: dotnet test tests\ColonyOptimizer.Tests\ColonyOptimizer.Tests.csproj -c Release --no-restore
      - name: Build release package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          .\scripts\Publish-Release.ps1 -Version $version
      - name: Smoke release packages
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME.TrimStart('v') } else { ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          .\scripts\Test-ReleasePackages.ps1 -ArtifactRoot (Join-Path $PWD "artifacts") -Version $version
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ColonyOptimizer-win-x64
          path: artifacts\*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: ColonyOptimizer-win-x64
          path: artifacts
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          $version = $env:TAG.TrimStart('v')
          $heading = "## [$version]"
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf([string[]]$lines, $heading)
          if ($start -lt 0) {
            throw "Release tag $env:TAG has no curated CHANGELOG.md entry headed '$heading'."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## ') {
              $end = $index
              break
            }
          }

          if ($end -le $start + 1) {
            throw "Release tag $env:TAG has an empty curated CHANGELOG.md entry."
          }

          $notes = ($lines[($start + 1)..($end - 1)] -join [Environment]::NewLine).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release tag $env:TAG has an empty curated CHANGELOG.md entry."
          }

          $notesPath = Join-Path $PWD 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -NoNewline -Encoding utf8
          gh release create $env:TAG $assets --repo $env:GITHUB_REPOSITORY --title "Colony Optimiser $env:TAG" --notes-file $notesPath
