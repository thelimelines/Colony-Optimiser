name: Check latest Colony Survival compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    name: Test latest Colony Survival data
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COLONY_SURVIVAL_GAMEDATA: ${{ github.workspace }}\work\ColonySurvival\gamedata
    steps:
      - name: Check out Colony Optimizer
        uses: actions/checkout@v7
      - name: Check out latest public Colony Survival data
        uses: actions/checkout@v7
        with:
          repository: pipliz/ColonySurvival
          path: work/ColonySurvival
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore ColonyOptimizer.slnx --runtime win-x64 --locked-mode
      - name: Test compatibility with latest Colony Survival data
        run: dotnet test tests\ColonyOptimizer.Tests\ColonyOptimizer.Tests.csproj -c Release --no-restore
