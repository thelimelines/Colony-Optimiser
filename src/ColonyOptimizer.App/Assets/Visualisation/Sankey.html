<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #102025; color: #edf6f5; font: 13px "Segoe UI", sans-serif; }
    svg { width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
    svg:active { cursor: grabbing; }
    .link { fill: none; stroke-opacity: .5; mix-blend-mode: screen; }
    .edge { fill: none; stroke: #78aeb0; stroke-width: 1.6; opacity: .86; stroke-linejoin: round; stroke-linecap: round; }
    .edge-label { fill: #e7f1f0; font-size: 11px; pointer-events: none; paint-order: stroke; stroke: #102025; stroke-width: 3px; stroke-linejoin: round; }
    .node rect { stroke-width: 1; }
    .node text { fill: #f4faf9; font-size: 13px; font-weight: 600; pointer-events: none; }
    .node .kind, .node .detail { fill: #c8dfdc; font-size: 11px; font-weight: 400; }
    #tooltip { position: fixed; display: none; z-index: 2; pointer-events: none; background: #0d1518; border: 1px solid #77b9b5; padding: 8px 10px; color: #f4faf9; max-width: 280px; }
    #empty { position: fixed; inset: 0; display: grid; place-items: center; color: #abc6c7; font-size: 15px; }
  </style>
</head>
<body>
  <div id="empty">Run Optimise to populate the production graph.</div>
  <div id="tooltip"></div>
  <svg id="graph" aria-label="Production node visualiser">
    <defs><marker id="arrow" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-5L10,0L0,5" fill="#78aeb0" /></marker></defs>
  </svg>
  <script src="sankey-circular.bundle.js"></script>
  <script src="elk.bundled.js"></script>
  <script>
    const svg = d3.select('#graph');
    const viewport = svg.append('g');
    const tooltip = d3.select('#tooltip');
    const nodeWidth = 188, nodeHeight = 64;
    const palette = {
      input: { fill: '#24535b', border: '#7daeb1' },
      recipe: { fill: '#245f65', border: '#6cc5be' },
      output: { fill: '#25615f', border: '#6de0c6' }
    };
    let graphState = { hasData: false, mode: 0, nodes: 0, links: 0, panEnabled: true, wheelZoomEnabled: true };
    let renderPromise = Promise.resolve();

    function showTooltip(node) {
      const jobBlock = node.jobBlock
        ? `<br><span style="color:#bdd6d4">Job blocks: ${node.jobBlocks || 1}x ${node.jobBlock}</span>`
        : '';
      tooltip.html(`<strong>${node.label}</strong><br><span style="color:#bdd6d4">${node.role || node.kind}</span>${jobBlock}`).style('display', 'block');
    }
    function moveTooltip() { tooltip.style('left', `${d3.event.clientX + 14}px`).style('top', `${d3.event.clientY + 14}px`); }
    function hideTooltip() { tooltip.style('display', 'none'); }
    const graphElement = svg.node();
    let pan = null;
    let viewTransform = { x: 0, y: 0, k: 1 };

    function applyViewTransform() {
      viewport.attr('transform', `translate(${viewTransform.x},${viewTransform.y}) scale(${viewTransform.k})`);
    }
    function isNodeTarget(target) {
      return target instanceof Element && target.closest('.node');
    }
    graphElement.addEventListener('pointerdown', event => {
      if (event.button !== 0 || isNodeTarget(event.target)) return;
      pan = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, originX: viewTransform.x, originY: viewTransform.y };
      try { graphElement.setPointerCapture(event.pointerId); } catch (_) { /* Synthetic verification events have no active pointer. */ }
      event.preventDefault();
    });
    graphElement.addEventListener('pointermove', event => {
      if (!pan || pan.pointerId !== event.pointerId) return;
      viewTransform.x = pan.originX + event.clientX - pan.x;
      viewTransform.y = pan.originY + event.clientY - pan.y;
      applyViewTransform();
      event.preventDefault();
    });
    graphElement.addEventListener('pointerup', event => {
      if (pan && pan.pointerId === event.pointerId) pan = null;
    });
    graphElement.addEventListener('pointercancel', () => { pan = null; });
    graphElement.addEventListener('wheel', event => {
      event.preventDefault();
      const bounds = graphElement.getBoundingClientRect();
      const cursorX = event.clientX - bounds.left;
      const cursorY = event.clientY - bounds.top;
      const nextScale = Math.max(0.25, Math.min(5, viewTransform.k * Math.exp(-event.deltaY * 0.0015)));
      const scaleChange = nextScale / viewTransform.k;
      viewTransform.x = cursorX - (cursorX - viewTransform.x) * scaleChange;
      viewTransform.y = cursorY - (cursorY - viewTransform.y) * scaleChange;
      viewTransform.k = nextScale;
      applyViewTransform();
    }, { passive: false });

    function graphPoint(event) {
      const bounds = graphElement.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left - viewTransform.x) / viewTransform.k,
        y: (event.clientY - bounds.top - viewTransform.y) / viewTransform.k
      };
    }
    function enableNodeDrag(selection, onDrag) {
      selection.each(function(node) {
        const element = this;
        let drag = null;
        element.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          const point = graphPoint(event);
          drag = { pointerId: event.pointerId, point, x: node.x ?? node.x0, y: node.y ?? node.y0 };
          try { element.setPointerCapture(event.pointerId); } catch (_) { /* Pointer capture is unavailable for synthetic events. */ }
          event.stopPropagation();
          event.preventDefault();
        });
        element.addEventListener('pointermove', event => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          const point = graphPoint(event);
          onDrag(node, drag.x + point.x - drag.point.x, drag.y + point.y - drag.point.y);
          event.preventDefault();
        });
        const endDrag = event => {
          if (drag && drag.pointerId === event.pointerId) drag = null;
        };
        element.addEventListener('pointerup', endDrag);
        element.addEventListener('pointercancel', endDrag);
      });
    }

    function redrawSankey(graph, sankey, selection) {
      selection.selectAll('.link').attr('d', d => d.path).attr('stroke-width', d => Math.max(1, d.width));
      selection.selectAll('.node').attr('transform', d => `translate(${d.x0},${d.y0})`);
    }

    function renderSankey(data, width, height) {
      const graphData = { nodes: data.nodes.map(node => Object.assign({}, node)), links: data.links.map(link => Object.assign({}, link)) };
      const sankey = d3.sankeyCircular()
        .nodeId(node => node.id)
        .nodeWidth(16)
        .nodePadding(18)
        .nodeAlign(d3.sankeyJustify)
        .extent([[26, 58], [width - 26, height - 58]])
        .iterations(48);
      const graph = sankey(graphData);
      const links = viewport.append('g').selectAll('path').data(graph.links).enter().append('path')
        .attr('class', 'link visual-link')
        .attr('d', link => link.path)
        .attr('stroke', link => link.source.kind === 'Recipe' ? '#7bb985' : '#5f8f9d')
        .attr('stroke-width', link => Math.max(1, link.width))
        .append('title').text(link => `${link.item}: ${link.value.toFixed(2)}`);
      const nodes = viewport.append('g').selectAll('g').data(graph.nodes).enter().append('g').attr('class', 'node')
        .attr('transform', node => `translate(${node.x0},${node.y0})`)
        .on('mouseenter', showTooltip).on('mousemove', moveTooltip).on('mouseleave', hideTooltip);
      enableNodeDrag(nodes, (node, x, y) => {
          const nodeHeight = node.y1 - node.y0;
          node.y0 = Math.max(40, Math.min(height - 40 - nodeHeight, y));
          node.y1 = node.y0 + nodeHeight;
          sankey.update(graph);
          redrawSankey(graph, sankey, viewport);
      });
      nodes.append('rect').attr('height', node => Math.max(1, node.y1 - node.y0)).attr('width', node => node.x1 - node.x0)
        .attr('fill', node => node.kind === 'Recipe' ? '#7bb985' : '#5f8f9d').attr('stroke', '#d6f0ed');
      nodes.append('text').attr('x', node => node.x0 < width / 2 ? 22 : -8).attr('y', 14)
        .attr('text-anchor', node => node.x0 < width / 2 ? 'start' : 'end').text(node => node.label);
      nodes.append('text').attr('class', 'kind').attr('x', node => node.x0 < width / 2 ? 22 : -8).attr('y', 30)
        .attr('text-anchor', node => node.x0 < width / 2 ? 'start' : 'end').text(node => node.jobBlock || node.kind);
    }

    function collapseItemNodes(data) {
      const allNodesById = new Map(data.nodes.map(node => [node.id, node]));
      const itemNodes = data.nodes.filter(node => node.kind === 'Item');
      const collapsedLinks = new Map();
      const retainedItems = new Map();
      const epsilon = 0.0001;

      function addLink(source, target, item, value) {
        if (value <= epsilon) return;
        const key = `${source}|${target}|${item}`;
        const existing = collapsedLinks.get(key);
        if (existing) existing.value += value;
        else collapsedLinks.set(key, { source, target, item, value });
      }

      function retainItem(itemId, role) {
        const item = allNodesById.get(itemId);
        if (!item) return;
        const retained = retainedItems.get(itemId);
        if (!retained || role === 'Input') retainedItems.set(itemId, Object.assign({}, item, { role }));
      }

      itemNodes.forEach(item => {
        const producers = data.links
          .filter(link => link.target === item.id && allNodesById.get(link.source)?.kind === 'Recipe')
          .map(link => Object.assign({}, link));
        const consumers = data.links
          .filter(link => link.source === item.id && allNodesById.get(link.target)?.kind === 'Recipe')
          .map(link => Object.assign({}, link));

        if (producers.length === 0) {
          if (consumers.length > 0) retainItem(item.id, 'Input');
          consumers.forEach(link => addLink(item.id, link.target, link.item, link.value));
          return;
        }
        if (consumers.length === 0) {
          retainItem(item.id, 'Output');
          producers.forEach(link => addLink(link.source, item.id, link.item, link.value));
          return;
        }

        let producerIndex = 0, consumerIndex = 0;
        while (producerIndex < producers.length && consumerIndex < consumers.length) {
          const producer = producers[producerIndex], consumer = consumers[consumerIndex];
          const transferred = Math.min(producer.value, consumer.value);
          addLink(producer.source, consumer.target, item.id.substring('item:'.length), transferred);
          producer.value -= transferred;
          consumer.value -= transferred;
          if (producer.value <= epsilon) producerIndex++;
          if (consumer.value <= epsilon) consumerIndex++;
        }

        producers.filter(link => link.value > epsilon).forEach(link => {
          retainItem(item.id, 'Output');
          addLink(link.source, item.id, link.item, link.value);
        });
        consumers.filter(link => link.value > epsilon).forEach(link => {
          retainItem(item.id, 'Input');
          addLink(item.id, link.target, link.item, link.value);
        });
      });

      const nodes = data.nodes
        .filter(node => node.kind === 'Recipe')
        .map(node => Object.assign({}, node))
        .concat(Array.from(retainedItems.values()));
      const nodeIds = new Set(nodes.map(node => node.id));
      return {
        nodes,
        links: Array.from(collapsedLinks.values()).filter(link => nodeIds.has(link.source) && nodeIds.has(link.target))
      };
    }

    function setNodeAppearance(nodes) {
      nodes.forEach(node => {
        if (node.kind === 'Recipe') {
          node.role = null;
          node.colours = palette.recipe;
        } else {
          node.colours = palette[(node.role || 'Output').toLowerCase()];
        }
      });
    }

    function linkPoints(link, byId, direction) {
      const source = byId.get(link.source), target = byId.get(link.target);
      if (!source || !target) return [];
      const horizontal = direction !== 'DOWN';
      const sourcePoint = horizontal
        ? { x: source.x + (target.x >= source.x ? nodeWidth / 2 : -nodeWidth / 2), y: source.y }
        : { x: source.x, y: source.y + (target.y >= source.y ? nodeHeight / 2 : -nodeHeight / 2) };
      const targetPoint = horizontal
        ? { x: target.x + (target.x >= source.x ? -nodeWidth / 2 : nodeWidth / 2), y: target.y }
        : { x: target.x, y: target.y + (target.y >= source.y ? -nodeHeight / 2 : nodeHeight / 2) };
      return [sourcePoint, targetPoint];
    }

    function pointsToPath(points) {
      return points.length ? `M${points.map(point => `${point.x},${point.y}`).join('L')}` : '';
    }

    function labelPoint(points) {
      if (points.length < 2) return points[0] || { x: 0, y: 0 };
      const totalLength = points.slice(1).reduce((length, point, index) => {
        const previous = points[index];
        return length + Math.hypot(point.x - previous.x, point.y - previous.y);
      }, 0);
      let remaining = totalLength / 2;
      for (let index = 1; index < points.length; index++) {
        const start = points[index - 1], end = points[index];
        const length = Math.hypot(end.x - start.x, end.y - start.y);
        if (remaining <= length || index === points.length - 1) {
          const ratio = length === 0 ? 0 : remaining / length;
          return { x: start.x + (end.x - start.x) * ratio, y: start.y + (end.y - start.y) * ratio };
        }
        remaining -= length;
      }
      return points[points.length - 1];
    }

    async function renderNodeVisualiser(data) {
      const collapsedGraph = collapseItemNodes(data);
      const nodes = collapsedGraph.nodes;
      const byId = new Map(nodes.map(node => [node.id, node]));
      const links = collapsedGraph.links.map((link, index) => Object.assign({ id: `edge-${index}` }, link));
      setNodeAppearance(nodes);
      const layoutDirection = data.layout && data.layout.direction === 'DOWN' ? 'DOWN' : 'RIGHT';
      const nodeSpacing = Math.max(16, Number(data.layout && data.layout.nodeSpacing) || 44);
      const layerSpacing = Math.max(48, Number(data.layout && data.layout.layerSpacing) || 96);
      const elk = new ELK();
      const layout = await elk.layout({
        id: 'production',
        layoutOptions: {
          'elk.algorithm': 'layered',
          'elk.direction': layoutDirection,
          'elk.edgeRouting': 'POLYLINE',
          'elk.spacing.nodeNode': String(nodeSpacing),
          'elk.layered.spacing.nodeNodeBetweenLayers': String(layerSpacing),
          'elk.layered.cycleBreaking.strategy': 'GREEDY',
          'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
          'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX'
        },
        children: nodes.map(node => ({ id: node.id, width: nodeWidth, height: nodeHeight })),
        edges: links.map(link => ({ id: link.id, sources: [link.source], targets: [link.target] }))
      });
      const laidOutNodes = new Map((layout.children || []).map(node => [node.id, node]));
      nodes.forEach(node => {
        const position = laidOutNodes.get(node.id);
        node.x = (position ? position.x : 0) + nodeWidth / 2;
        node.y = (position ? position.y : 0) + nodeHeight / 2;
      });
      const edgeLayer = viewport.append('g');
      const labelLayer = viewport.append('g');
      const nodeLayer = viewport.append('g');
      const edges = edgeLayer.selectAll('path').data(links).enter().append('path').attr('class', 'edge visual-link').attr('marker-end', 'url(#arrow)');
      const labels = labelLayer.selectAll('text').data(links).enter().append('text').attr('class', 'edge-label').attr('text-anchor', 'middle')
        .text(link => `${link.item} ${link.value.toFixed(1)} / cycle`);
      const groups = nodeLayer.selectAll('g').data(nodes).enter().append('g').attr('class', 'node')
        .on('mouseenter', showTooltip).on('mousemove', moveTooltip).on('mouseleave', hideTooltip);
      groups.append('rect').attr('x', -nodeWidth / 2).attr('y', -nodeHeight / 2).attr('width', nodeWidth).attr('height', nodeHeight).attr('rx', 4)
        .attr('fill', node => node.colours.fill).attr('stroke', node => node.colours.border);
      groups.append('text').attr('text-anchor', 'middle').attr('y', -7).text(node => node.label);
      groups.append('text').attr('class', 'detail').attr('text-anchor', 'middle').attr('y', 15)
        .text(node => node.jobBlock ? `${node.jobBlocks || 1}x ${node.jobBlock}` : node.role);

      function update() {
        groups.attr('transform', node => `translate(${node.x},${node.y})`);
        edges.attr('d', link => pointsToPath(linkPoints(link, byId, layoutDirection)));
        labels.attr('x', link => labelPoint(linkPoints(link, byId, layoutDirection)).x)
          .attr('y', link => labelPoint(linkPoints(link, byId, layoutDirection)).y - 8);
      }
      update();
      enableNodeDrag(groups, (node, x, y) => {
        node.x = Math.max(nodeWidth / 2 + 16, x);
        node.y = Math.max(nodeHeight / 2 + 16, y);
        update();
      });
      return { originalNodeCount: data.nodes.length, collapsedItemNodes: data.nodes.length - nodes.length };
    }

    async function renderGraph(data) {
      viewport.selectAll('*').remove();
      tooltip.style('display', 'none');
      const hasData = data && data.nodes && data.nodes.length && data.links && data.links.length;
      const mode = data && data.mode === 1 ? 1 : 0;
      d3.select('#empty').style('display', hasData ? 'none' : 'grid');
      graphState = { hasData: !!hasData, mode, nodes: 0, links: 0, panEnabled: true, wheelZoomEnabled: true, layoutEngine: mode === 1 ? 'elk-layered' : 'sankey-circular' };
      if (!hasData) return;
      const width = Math.max(1000, svg.node().getBoundingClientRect().width || 1000);
      if (data.mode === 0) renderSankey(data, width, Math.max(640, svg.node().getBoundingClientRect().height || 640));
      else Object.assign(graphState, await renderNodeVisualiser(data));
      graphState.nodes = viewport.selectAll('.node').size();
      graphState.links = viewport.selectAll('.visual-link').size();
    }
    window.setGraph = function(data) {
      renderPromise = renderGraph(data);
      return renderPromise;
    };
    window.waitForGraph = () => renderPromise;
    window.getGraphState = () => graphState;
    window.verifyNavigation = () => {
      const original = { x: viewTransform.x, y: viewTransform.y, k: viewTransform.k };
      try {
        graphElement.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 991, button: 0, clientX: 80, clientY: 80 }));
        graphElement.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 991, clientX: 120, clientY: 105 }));
        graphElement.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 991, clientX: 120, clientY: 105 }));
        const panWorked = viewTransform.x !== original.x || viewTransform.y !== original.y;
        graphElement.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: 100, clientY: 100, deltaY: -120 }));
        const wheelWorked = viewTransform.k !== original.k;
        return { panWorked, wheelWorked };
      } finally {
        viewTransform = original;
        applyViewTransform();
      }
    };
  </script>
</body>
</html>
