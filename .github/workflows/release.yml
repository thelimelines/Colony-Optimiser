name: Verify and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COLONY_SURVIVAL_GAMEDATA: ${{ github.workspace }}\work\ColonySurvival\gamedata
    steps:
      - name: Check out Colony Optimizer
        uses: actions/checkout@v7
      - name: Check out public Colony Survival data
        uses: actions/checkout@v7
        with:
          repository: pipliz/ColonySurvival
          path: work/ColonySurvival
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies and refresh the lock graph
        shell: pwsh
        run: |
          dotnet restore ColonyOptimizer.slnx --runtime win-x64 --force-evaluate
          dotnet restore installer\ColonyOptimizer.Installer\ColonyOptimizer.Installer.wixproj --force-evaluate
          dotnet restore installer\ColonyOptimizer.Setup\ColonyOptimizer.Setup.wixproj --force-evaluate
      - name: Run tests
        run: dotnet test tests\ColonyOptimizer.Tests\ColonyOptimizer.Tests.csproj -c Release --no-restore
      - name: Build release package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          .\scripts\Publish-Release.ps1 -Version $version
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ColonyOptimizer-win-x64
          path: artifacts\*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ColonyOptimizer-win-x64
          path: artifacts
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create $env:TAG $assets --title "Colony Optimiser $env:TAG" --generate-notes
